# pyproject.toml
[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "modular-spacecraft-rl"
version = "0.1.0"
description = "Simulation & RL framework for mission-driven reconfiguration of modular spacecraft."
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.23",
]

[project.optional-dependencies]
viz = ["matplotlib>=3.5", "pillow>=9.0"]
rl = ["torch>=2.0"]
dev = ["pytest>=7.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]